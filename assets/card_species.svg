<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150" role="img" aria-label="Native vs Invasive: Does it hold up on an island it never saw?"><title>Native vs Invasive: Does it hold up on an island it never saw?</title><rect x="0.5" y="0.5" width="479" height="149" rx="16" fill="#264735" stroke="#A2B5A0" stroke-opacity="0.22"/><rect x="0.5" y="22" width="3" height="40" rx="1.5" fill="#6B7F4E"/><g transform="translate(26 24) scale(0.62)" fill="none" stroke="#DCC8A3" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"><rect x="6" y="16" width="52" height="34" rx="8"/><circle cx="32" cy="33" r="11"/><circle cx="32" cy="33" r="4"><animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/></circle><path d="M18 16L22 10H42L46 16"/></g><text x="80" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#DCC8A3">Native vs Invasive</text><text x="80" y="62" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#A2B5A0">Does it hold up on an island it never saw?</text><text x="26" y="98" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#F4EEE0">BioCLIP, SpeciesNet and DINOv2 compared,</text><text x="26" y="116" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#F4EEE0">then tested out of distribution in Hawai'i.</text><text x="26" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="0.6" fill="#A2B5A0">BioCLIP  ·  SpeciesNet  ·  DINOv2  ·  FAISS</text></svg>