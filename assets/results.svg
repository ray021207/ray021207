<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Measured results: classifier accuracy, chest X-ray AUROC, and three headline numbers"><title>Measured results: classifier accuracy, chest X-ray AUROC, and three headline numbers</title><rect x="0.5" y="0.5" width="999" height="399" rx="18" fill="#1F3D2E" stroke="#A2B5A0" stroke-opacity="0.22"/><text x="40" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#DCC8A3">Numbers I stand behind</text><text x="40" y="74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A2B5A0">Every stage ends in a measurement, including the ones that went the wrong way.</text><text x="40" y="116" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#A2B5A0">Native vs invasive species, camera traps</text><text x="40" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#F4EEE0">Majority-class baseline</text><rect x="40" y="151" width="330" height="8" rx="4" fill="#fff" opacity="0.08"/><rect x="40" y="151" width="0" height="8" rx="4" fill="#A2B5A0" opacity="0.55"><animate attributeName="width" from="0" to="198.0" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="384" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#F4EEE0">60.0%</text><text x="40" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#A2B5A0">always guess the commonest label</text><text x="40" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#F4EEE0">BioCLIP, zero-shot</text><rect x="40" y="207" width="330" height="8" rx="4" fill="#fff" opacity="0.08"/><rect x="40" y="207" width="0" height="8" rx="4" fill="#A2B5A0" opacity="0.55"><animate attributeName="width" from="0" to="277.9" dur="1.6s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="384" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#F4EEE0">84.2%</text><text x="40" y="234" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#A2B5A0">country-restricted lookup</text><text x="40" y="254" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#F4EEE0">SpeciesNet, fine-tuned head</text><rect x="40" y="263" width="330" height="8" rx="4" fill="#fff" opacity="0.08"/><rect x="40" y="263" width="0" height="8" rx="4" fill="#DCC8A3" opacity="1"><animate attributeName="width" from="0" to="321.2" dur="1.6s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="384" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#DCC8A3">97.34%</text><text x="40" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#A2B5A0">+13.1 points over BioCLIP</text><text x="530" y="116" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#A2B5A0">Chest X-ray, 174k radiographs (AUROC)</text><text x="530" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#F4EEE0">DINOv2 localisation head</text><rect x="530" y="151" width="330" height="8" rx="4" fill="#fff" opacity="0.08"/><rect x="530" y="151" width="0" height="8" rx="4" fill="#A2B5A0" opacity="0.55"><animate attributeName="width" from="0" to="158.4" dur="1.6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="874" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#F4EEE0">≈ 0.48</text><text x="530" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#A2B5A0">reported as is: it underperforms</text><text x="530" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#F4EEE0">Multi-label classifier</text><rect x="530" y="207" width="330" height="8" rx="4" fill="#fff" opacity="0.08"/><rect x="530" y="207" width="0" height="8" rx="4" fill="#DCC8A3" opacity="1"><animate attributeName="width" from="0" to="264.0" dur="1.6s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="874" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#DCC8A3">≈ 0.80</text><text x="530" y="234" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#A2B5A0">stable under a patient-level 80/20 split</text><line x1="40" y1="318" x2="320" y2="318" stroke="#A2B5A0" stroke-opacity="0.25"/><g opacity="0"><text x="40" y="354" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#DCC8A3">59%</text><text x="40" y="374" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#F4EEE0">of baseline embodied-QA episodes</text><text x="40" y="389" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#A2B5A0">answered confidently wrong</text><animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.2s" fill="freeze"/></g><line x1="353" y1="318" x2="633" y2="318" stroke="#A2B5A0" stroke-opacity="0.25"/><g opacity="0"><text x="353" y="354" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#DCC8A3">~20%</text><text x="353" y="374" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#F4EEE0">better path efficiency from A*-progress</text><text x="353" y="389" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#A2B5A0">reward shaping, TurtleBot in Gazebo</text><animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.45s" fill="freeze"/></g><line x1="666" y1="318" x2="946" y2="318" stroke="#A2B5A0" stroke-opacity="0.25"/><g opacity="0"><text x="666" y="354" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#DCC8A3">0.98–0.99</text><text x="666" y="374" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#F4EEE0">correlation with ADWR subsidence rates</text><text x="666" y="389" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#A2B5A0">SE Arizona (Sinkronized, NISAR)</text><animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.7s" fill="freeze"/></g></svg>